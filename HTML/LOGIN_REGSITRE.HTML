<style>
        body {

            color: #e5e2e1;

<body class="min-h-screen flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop">
<!-- Background Decorative Element -->
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Container -->
<main class="w-full max-w-md z-10">
<!-- Header Section -->
<header class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 mb-md flex items-center justify-center bg-surface-container rounded-full amber-glow border border-white/5">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">
                    cookie
                </span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tighter">ALFA TIER</h1>
<p class="font-body-md text-on-surface-variant mt-xs opacity-70">El archivo definitivo de alfajores.</p>
</header>
<!-- Form Card -->
<div class="glass-card rounded-xl p-md md:p-lg w-full">
<!-- Toggle Tabs -->
<div class="flex p-1 bg-surface-container-lowest rounded-lg mb-lg border border-white/5">
<button class="flex-1 py-xs font-label-md text-label-md rounded-md transition-all bg-primary text-on-primary" id="tab-login" onclick="switchForm('login')">
                    Iniciar Sesión
                </button>
<button class="flex-1 py-xs font-label-md text-label-md rounded-md transition-all text-on-surface-variant hover:text-on-surface" id="tab-register" onclick="switchForm('register')">
                    Registrarse
                </button>
</div>
<!-- Forms Wrapper -->
<div class="relative overflow-hidden">
<!-- Login Form -->
<form class="form-transition opacity-100 flex flex-col gap-sm" id="form-login">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Usuario</label>
<input class="bg-surface-container-lowest border-white/10 text-on-surface rounded-lg px-sm py-sm focus:ring-primary focus:border-primary placeholder:text-white/20 transition-all font-body-md" placeholder="nombredeusuario" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Contraseña</label>
<input class="bg-surface-container-lowest border-white/10 text-on-surface rounded-lg px-sm py-sm focus:ring-primary focus:border-primary placeholder:text-white/20 transition-all font-body-md" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-sm rounded-lg mt-md hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
                        Ingresar
                    </button>
</form>
<!-- Register Form (Hidden by default) -->
<form class="form-transition opacity-0 pointer-events-none hidden flex flex-col gap-sm" id="form-register">
<div class="grid grid-cols-2 gap-sm">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Nombre</label>
<input class="bg-surface-container-lowest border-white/10 text-on-surface rounded-lg px-sm py-sm focus:ring-primary focus:border-primary placeholder:text-white/20 transition-all font-body-md" placeholder="Ej. Juan" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Apellido</label>
<input class="bg-surface-container-lowest border-white/10 text-on-surface rounded-lg px-sm py-sm focus:ring-primary focus:border-primary placeholder:text-white/20 transition-all font-body-md" placeholder="Ej. Pérez" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Usuario</label>
<input class="bg-surface-container-lowest border-white/10 text-on-surface rounded-lg px-sm py-sm focus:ring-primary focus:border-primary placeholder:text-white/20 transition-all font-body-md" placeholder="elegí_tu_alias" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Contraseña</label>
<input class="bg-surface-container-lowest border-white/10 text-on-surface rounded-lg px-sm py-sm focus:ring-primary focus:border-primary placeholder:text-white/20 transition-all font-body-md" placeholder="Mínimo 8 caracteres" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-sm rounded-lg mt-md hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
                        Crear cuenta
                    </button>
</form>
</div>
</div>
<!-- Footer State Toggle -->
<footer class="mt-lg text-center">
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" id="footer-toggle" onclick="toggleMode()">
                ¿No tienes una cuenta? <span class="font-bold border-b border-primary/30">Crea una ahora</span>
</button>
</footer>
</main>
<!-- UI Interaction Script -->
<script>
        function switchForm(mode) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const footerToggle = document.getElementById('footer-toggle');

            if (mode === 'login') {
                loginForm.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                loginForm.classList.add('opacity-100');
                registerForm.classList.add('hidden', 'opacity-0', 'pointer-events-none');
                
                loginTab.classList.add('bg-primary', 'text-on-primary');
                loginTab.classList.remove('text-on-surface-variant');
                registerTab.classList.remove('bg-primary', 'text-on-primary');
                registerTab.classList.add('text-on-surface-variant');

                footerToggle.innerHTML = '¿No tienes una cuenta? <span class="font-bold border-b border-primary/30">Crea una ahora</span>';
            } else {
                registerForm.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                registerForm.classList.add('opacity-100');
                loginForm.classList.add('hidden', 'opacity-0', 'pointer-events-none');

                registerTab.classList.add('bg-primary', 'text-on-primary');
                registerTab.classList.remove('text-on-surface-variant');
                loginTab.classList.remove('bg-primary', 'text-on-primary');
                loginTab.classList.add('text-on-surface-variant');

                footerToggle.innerHTML = '¿Ya eres miembro? <span class="font-bold border-b border-primary/30">Inicia sesión</span>';
            }
        }

        function toggleMode() {
            const loginVisible = !document.getElementById('form-login').classList.contains('hidden');
            switchForm(loginVisible ? 'register' : 'login');
        }
    </script>
</body></html>
